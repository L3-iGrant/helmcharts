# NATS server of the Docker Compose platform: one server with JetStream.
# The same settings as the NATS of the Helm chart (templates/nats/
# configmap.yaml): max_payload 4MB and one nkey user for each process, no
# user without credentials. The monitoring port 8222 is only on the Compose
# network (the health check uses it).
port: 4222
http_port: 8222
server_name: igrant-nats
lame_duck_duration: "30s"
lame_duck_grace_period: "10s"
max_payload: 4MB
jetstream {
  store_dir: "/data"
  max_file_store: 10Gi
  max_memory_store: 0
}

# The users and their subjects (generated from the Helm chart: make
# nats-config). users.conf includes nkeys.conf, the public nkeys
# that make secrets writes from the seeds of the processes.
include ./users.conf
