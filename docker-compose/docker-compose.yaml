# The iGrant.io platform for Docker Compose. README.md has the procedure:
#
#   make env       make .env from .env.example, then set your values
#   make secrets   make all secrets and keys in secrets/
#   make check     check the configuration (no container starts)
#   make up        start the platform
#
# The services are in compose.platform.yaml. This file loads it with two
# files of values:
#   - .env: your settings, for example DB_ENGINE (postgresql or mysql), the
#     public URLs and the images;
#   - config/engine/<DB_ENGINE>.env: the values that follow from the engine
#     (database port, admin user, client image).
# Thus DB_ENGINE is the one choice of the database engine of all
# components. A value in your shell has priority over the same value in
# .env.
name: igrant-platform

include:
  - path: compose.platform.yaml
    env_file:
      - .env
      - config/engine/${DB_ENGINE:-postgresql}.env
