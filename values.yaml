# Namespace for kubernetes cluster
namespace: ig
# Prefix for kubernetes object names
prefix:
# Resource constraints for a pod
resources: {}
# Security context for a pod
# OpenShift restricted-v2 SCC compatible: run as non-root, no privilege escalation.
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
# Storage class name
storageClassName: local-path

# Postgres
postgres:
  enabled: true
  # Container image
  imagePullSecret: igrant-registry-creds
  image: europe-docker.pkg.dev/jenkins-189019/igrantio/postgres:2025.1.1
  # Username
  username: dbadmin
  # Password
  password: ZuNQCnmjWiRRsRLpwCPJQY
  # Database name
  database: kcdb

# Keycloak
keycloak:
  enabled: true
  # Container image
  imagePullSecret: igrant-registry-creds
  # Updated to a current supported Keycloak release (was 12.0.4-debian-10-r1, EOL).
  # Confirm this exact tag is mirrored in the registry before deployment.
  image: europe-docker.pkg.dev/jenkins-189019/igrantio/keycloak:26.0.7-debian-12-r0
  # Username
  adminUsername: kcadmin
  # Password
  adminPassword: uepqcRJBWbxWOciByffPiv
  # Database username
  dbUsername: dbadmin
  # Database user password
  dbPassword: ZuNQCnmjWiRRsRLpwCPJQY
  # Database name
  dbName: kcdb
  # Frontend URL
  frontendUrl: https://keycloak.eubw.dev
  # Ingress
  ingress:
    enabled: true
    # Annotations for the ingress
    annotations:
      # Default annotations if ingress is nginx ingress
      # Allow HTTP false
      kubernetes.io/ingress.allow-http: "false"
      # Ingress class as NGINX
      kubernetes.io/ingress.class: nginx
      # Enable CORS
      nginx.ingress.kubernetes.io/enable-cors: "true"
      # Proxy buffer size
      nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
      # TLS
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      kubernetes.io/tls-acme: "true"
      # Proxy
      nginx.ingress.kubernetes.io/proxy-set-headers: |
        X-Forwarded-Proto https
        X-Forwarded-Port 443
    # Hosts
    hosts:
      - host: keycloak.eubw.dev
        paths:
          - path: /
            pathType: Prefix
    # TLS
    tls:
      - hosts:
          - keycloak.eubw.dev
        secretName: keycloak.eubw.dev-tls

# Mongodb
mongo:
  enabled: true
  # Container image
  imagePullSecret: igrant-registry-creds
  image: europe-docker.pkg.dev/jenkins-189019/igrantio/mongodb:7.0-debian-12
  username: dbadmin
  password: gQMvVsZDfCmvQcvGQlpNwY
  database: owsdb

# MariaDB / MySQL relational database
# On-premise relational store for LPID data, per PRH Annex 2.1 requirement 15
# (MySQL or MariaDB). MySQL-compatible; set credentials via a Kubernetes secret.
mariadb:
  enabled: true
  # Container image
  imagePullSecret: igrant-registry-creds
  image: europe-docker.pkg.dev/jenkins-189019/igrantio/mariadb:11.4-debian-12
  username: dbadmin
  # Set through a Kubernetes secret in the PRH deployment
  password: ""
  database: owsreldb

# NATS
nats:
  enabled: true
  # Container image
  image: nats:2.10.14-alpine

# RabbitMQ message-queue adapter
# External message-queue intake for inbound revocation instructions,
# per PRH Annex 2 requirement 2.14. Transport is configurable; queue and
# protocol are set to whatever PRH nominates.
rabbitmq:
  enabled: true
  # Container image
  imagePullSecret: igrant-registry-creds
  image: europe-docker.pkg.dev/jenkins-189019/igrantio/rabbitmq:3.13-debian-12
  username: rabbit
  # Set through a Kubernetes secret in the PRH deployment
  password: ""
  # Queue the solution consumes revocation instructions from (requirement 2.14)
  revocationQueue: prh.lpid.revocation

# API
api:
  enabled: true
  # Container image
  imagePullSecret: igrant-registry-creds
  image: europe-docker.pkg.dev/jenkins-189019/igrantio/api:2026.1.1
  # Ingress
  ingress:
    enabled: true
    # Annotations for the ingress
    annotations:
      # Default annotations if ingress is nginx ingress
      # Allow HTTP false
      kubernetes.io/ingress.allow-http: "false"
      # Ingress class as NGINX
      kubernetes.io/ingress.class: nginx
      # Enable CORS
      nginx.ingress.kubernetes.io/enable-cors: "true"
      # Proxy buffer size
      nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
      # TLS
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      kubernetes.io/tls-acme: "true"
    # Hosts
    hosts:
      - host: api.eubw.dev
        paths:
          - path: /
            pathType: Prefix
    # TLS
    tls:
      - hosts:
          - api.eubw.dev
        secretName: api.eubw.dev-tls
  # Configuration
  configuration:
    # Database
    database:
      # Host name
      host:
    # API key secret to generate and verify API keys
    ApiSecretKey: jZSkjkYXjJwoOcqSWQQGLv
    # Keycloak
    Iam:
      # Keycloak URL accessible from the internet
      url: https://keycloak.eubw.dev/auth
      # Keycloak realm name
      realm: igrant-users
      # Keycloak client id
      ClientId: igrant-ios-app
      # Identity Provider alias
      IdPAlias: login-with-eudi-wallet
    # NATS configuration
    Nats:
      # NATS server URL
      url:
      # Connection timeout in seconds
      timeout: 5

# Vault Facade
vaultFacade:
  enabled: true
  # Container image
  imagePullSecret: igrant-registry-creds
  image: europe-docker.pkg.dev/jenkins-189019/igrantio/vault-facade:2026.1.1
  # Application mode: "vault" or "mongo".
  # PRH deployments use "vault" in every environment (dev, test, acceptance, production);
  # the "mongo" mode is for local development only and is not used for PRH.
  appMode: vault
  # Vault configuration (used when appMode=vault)
  vault:
    # Vault server address
    addr:
    # Vault username
    user:
    # Vault password
    password:

# Organisation Wallet
organisationWallet:
  enabled: true
  # Container image
  imagePullSecret: igrant-registry-creds
  image: europe-docker.pkg.dev/jenkins-189019/igrantio/ows:2026.1.5
  # Database name
  dbName: walletdb
  service:
    # Ingress
    ingress:
      enabled: true
      # Annotations for the ingress
      annotations:
        # Default annotations if ingress is nginx ingress
        # Allow HTTP false
        kubernetes.io/ingress.allow-http: "false"
        # Ingress class as NGINX
        kubernetes.io/ingress.class: nginx
        # Enable CORS
        nginx.ingress.kubernetes.io/enable-cors: "true"
        # Proxy buffer size
        nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
        # TLS
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        kubernetes.io/tls-acme: "true"
      # Hosts
      hosts:
        - host: wallet.eubw.dev
          paths:
            - path: /
              pathType: Prefix
      # TLS
      tls:
        - hosts:
            - wallet.eubw.dev
          secretName: wallet.eubw.dev-tls

# OIDC Facade
oidcFacade:
  enabled: true
  # Container image
  imagePullSecret: igrant-registry-creds
  image: europe-docker.pkg.dev/jenkins-189019/igrantio/oidc-facade:2026.1.1
  # Database name
  dbName: oidcfacadedb
  # Configuration
  configuration:
    # Database
    database:
      # Host name (leave empty to use the shared mongo service)
      host:
    # NATS configuration
    Nats:
      # NATS server URL (leave empty to use the shared NATS service)
      url:
      # Connection timeout in seconds
      timeout: 5

# Enterprise dashboard
enterpriseDashboard:
  enabled: true
  # Container image
  imagePullSecret: igrant-registry-creds
  image: europe-docker.pkg.dev/jenkins-189019/igrantio/dashboard:2026.1.1
  # Ingress
  ingress:
    enabled: true
    # Annotations for the ingress
    annotations:
      # Default annotations if ingress is nginx ingress
      # Allow HTTP false
      kubernetes.io/ingress.allow-http: "false"
      # Ingress class as NGINX
      kubernetes.io/ingress.class: nginx
      # Enable CORS
      nginx.ingress.kubernetes.io/enable-cors: "true"
      # Proxy buffer size
      nginx.ingress.kubernetes.io/proxy-buffer-size: 128k
      # TLS
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      kubernetes.io/tls-acme: "true"
    # Hosts
    hosts:
      - host: dashboard.eubw.dev
        paths:
          - path: /
            pathType: Prefix
    # TLS
    tls:
      - hosts:
          - dashboard.eubw.dev
        secretName: dashboard.eubw.dev-tls
