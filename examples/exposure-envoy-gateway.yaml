# Exposure with Envoy Gateway (Gateway API): one HTTPRoute per public host,
# attached to your Gateway. The TLS ends at the Gateway (its listener has
# the certificate). Envoy streams the server-sent events and does not limit
# the body size of a route; the api route gets a request timeout above the
# longest stream (3900 s).
#
# The client address (rate limits, the IP allow-list of the API keys): your
# Gateway sets X-Real-IP to the address of the client and replaces a value
# that a client sends. Without this policy, do NOT set clientAddress.header
# (a client could then choose its own address); the services then see the
# address of an Envoy pod for every client. When a load balancer is in front
# of Envoy, it must pass the client address too (for example the PROXY
# protocol of the load balancer and `proxyProtocol: {}` in the same policy).
#   apiVersion: gateway.envoyproxy.io/v1alpha1
#   kind: ClientTrafficPolicy
#   metadata: {name: platform-client-address, namespace: envoy-gateway-system}
#   spec:
#     targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: platform}]
#     headers:
#       earlyRequestHeaders:
#         set:
#           - name: X-Real-IP
#             value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
exposure:
  type: gatewayAPI
  gatewayAPI:
    parentRefs:
      - name: platform                     # your Gateway
        namespace: envoy-gateway-system
        sectionName: https                 # its HTTPS listener
    # A request may take up to 60 s, as the gateway of the api allows (the
    # default of the proxy is 15 s; ingress-nginx waits 60 s). The api route
    # waits longer (below).
    timeouts:
      request: 60s
api:
  exposure:
    timeouts:
      request: 3900s
clientAddress:
  header: X-Real-IP                        # set by the policy above
networkPolicy:
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: envoy-gateway-system
    podSelector: {}
