{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    run: {{ .Values.namespace }}-{{ .Values.prefix }}-rabbitmq
  name: {{ .Values.namespace }}-{{ .Values.prefix }}-rabbitmq-svc
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - name: amqp
      port: 5672
      protocol: TCP
      targetPort: 5672
    - name: management
      port: 15672
      protocol: TCP
      targetPort: 15672
  selector:
    run: {{ .Values.namespace }}-{{ .Values.prefix }}-rabbitmq
{{- end }}
