{{- if .Values.nats.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ow.name" (list . "nats") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "nats") | nindent 4 }}
spec:
  ports:
    - name: client
      port: 4222
      targetPort: client
  selector:
    {{- include "ow.selectorLabels" (list . "nats") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ow.name" (list . "nats") }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "nats") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: cluster
      port: 6222
      targetPort: cluster
    - name: monitor
      port: 8222
      targetPort: monitor
  selector:
    {{- include "ow.selectorLabels" (list . "nats") | nindent 4 }}
{{- end }}
