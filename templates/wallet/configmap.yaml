{{- if .Values.organisationWallet.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.name" (list . "wallet") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "wallet") | nindent 4 }}
data:
  # Each wallet Deployment mounts its key as /etc/eudi-wallet/config.yaml.
  # No secret is in them.
  {{- range $role := list "service" "config" "scheduler" }}
  {{ $role }}.yaml: |
    # kms.vault: the login of the wallet to OpenBao (the Transit engine).
    {{- include "ow.wallet.config" (dict "root" $ "role" $role) | nindent 4 }}
  {{- end }}
  # Only the database: the file of the wallet Jobs (migrate-database and
  # read-access read only database and log_level).
  migrate.yaml: |
    {{- include "ow.wallet.migrateConfig" . | nindent 4 }}
{{- end }}
