{{- /*
The access of the api to the Kubernetes API for the privacy dashboards
(privacyDashboard.enabled): a ServiceAccount of the api pods, and a Role in
the target namespace with only the kinds and verbs that the api uses (get,
create, update, delete of ConfigMaps, Services, Deployments and Ingresses;
no list, no watch, no other namespace).
*/}}
{{- if and .Values.api.enabled .Values.privacyDashboard.enabled }}
{{- $namespace := required "privacyDashboard.namespace is required: the namespace of the privacy dashboards" .Values.privacyDashboard.namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ow.name" (list . "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "api") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ow.name" (list . "privacy-dashboard") }}
  namespace: {{ $namespace }}
  labels:
    {{- include "ow.labels" (list . "privacy-dashboard") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [get, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ow.name" (list . "privacy-dashboard") }}
  namespace: {{ $namespace }}
  labels:
    {{- include "ow.labels" (list . "privacy-dashboard") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ow.name" (list . "privacy-dashboard") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ow.name" (list . "api") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
