{{- if .Values.api.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.name" (list . "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "api") | nindent 4 }}
data:
  # The api and the operator Jobs mount api.yaml, the webhook handler mounts
  # webhook.yaml, each as /etc/igrant-api/config.yaml. No secret is in them.
  api.yaml: |
    {{- include "ow.api.config" (dict "root" . "role" "api") | nindent 4 }}
  webhook.yaml: |
    {{- include "ow.api.config" (dict "root" . "role" "webhook") | nindent 4 }}
{{- end }}
