{{- if .Values.oidcFacade.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.namespace }}-{{ .Values.prefix }}-oidc-facade
  name: {{ .Values.namespace }}-{{ .Values.prefix }}-oidc-facade-config-svc
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - name: http
      port: 7000
      targetPort: 7000
  selector:
    app: {{ .Values.namespace }}-{{ .Values.prefix }}-oidc-facade
{{- end }}
