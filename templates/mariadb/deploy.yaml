{{- if .Values.mariadb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: {{ .Values.namespace }}-{{ .Values.prefix }}-mariadb
  name: {{ .Values.namespace }}-{{ .Values.prefix }}-mariadb
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      run: {{ .Values.namespace }}-{{ .Values.prefix }}-mariadb
  template:
    metadata:
      labels:
        run: {{ .Values.namespace }}-{{ .Values.prefix }}-mariadb
    spec:
      {{- if .Values.mariadb.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.mariadb.imagePullSecret }}
      {{- end }}
      containers:
        - env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.username }}
            - name: MARIADB_PASSWORD
              value: {{ .Values.mariadb.password }}
            - name: MARIADB_ROOT_PASSWORD
              value: {{ .Values.mariadb.password }}
          image: {{ .Values.mariadb.image }}
          securityContext:
            {{- if .Values.securityContext }}
              {{- toYaml .Values.securityContext | nindent 12 }}
            {{- end }}
          resources:
            {{- if .Values.resources }}
              {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
          imagePullPolicy: Always
          name: {{ .Values.namespace }}-{{ .Values.prefix }}-mariadb
          ports:
            - containerPort: 3306
              protocol: TCP
          volumeMounts:
            - mountPath: /bitnami/mariadb
              name: mariadb-data
              subPath: mariadb
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: {{ .Values.namespace }}-{{ .Values.prefix }}-mariadb-pvc
{{- end }}
