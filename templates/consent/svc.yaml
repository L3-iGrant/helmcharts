{{- if .Values.consent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ow.name" (list . "consent") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "consent") | nindent 4 }}
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    {{- include "ow.selectorLabels" (list . "consent") | nindent 4 }}
{{- end }}
