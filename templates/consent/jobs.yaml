{{- /*
The read access Job of consent (readAccess.jobs): "read-access apply" for
the reader wallet (the data agreement view). It applies the schema
migrations first (init container "migrate schema"). The migrate and
read-access commands read only the database (config.LoadDatabase), so the
Job mounts the file migrate.yaml of the consent ConfigMap and only the
database password and CA, the password of the read-only user and of the
admin user. The name has the release revision: the Job runs at each install
and upgrade (idempotent).
*/}}
{{- if .Values.consent.enabled }}
{{- $c := .Values.consent }}
{{- $config := list "--config" "/etc/consent-migrate/config.yaml" }}
{{- $jobs := list }}
{{- if .Values.readAccess.jobs.enabled }}
{{- $admin := include "ow.readAccess.admin" (list . "consent") | fromJson }}
{{- range $reader := list "wallet" }}
{{- $user := include "ow.readAccess.reader" (list $ $reader "consent") | fromJson }}
{{- $args := concat (list "read-access" "apply") $config (list "--reader" $reader "--user" $user.username "--password-file" "/run/secrets/read-access/password" "--admin-user" $admin.user "--admin-password-file" "/run/secrets/read-access-admin/password") }}
{{- $jobs = append $jobs (dict "name" (printf "consent-read-access-%s" $reader) "args" $args "readerPassword" (dict "secret" $user.secret "key" $user.key) "admin" $admin "ttl" $.Values.readAccess.jobs.ttlSecondsAfterFinished "backoffLimit" 6) }}
{{- end }}
{{- end }}
{{- /* The Jobs run as a non-root user with a read-only root file system
(consent.jobs.podSecurityContext, .containerSecurityContext; empty: the
values of the consent pods). They write only to the /tmp memory volume. */}}
{{- $jobPod := deepCopy $c }}
{{- $_ := set $jobPod "podSecurityContext" ($c.jobs.podSecurityContext | default $c.podSecurityContext) }}
{{- $_ := set $jobPod "containerSecurityContext" ($c.jobs.containerSecurityContext | default $c.containerSecurityContext) }}
{{- range $job := $jobs }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ow.name" (list $ $job.name) }}-{{ $.Release.Revision }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ow.labels" (list $ $job.name) | nindent 4 }}
spec:
  {{- /* The read access Jobs are idempotent: they try again while the
  database starts (a new installation). */}}
  backoffLimit: {{ $job.backoffLimit | default 0 }}
  ttlSecondsAfterFinished: {{ $job.ttl }}
  template:
    metadata:
      labels:
        {{- include "ow.labels" (list $ $job.name) | nindent 8 }}
        {{- include "ow.netpol.labels" (list $ "job" list) | nindent 8 }}
    spec:
      restartPolicy: Never
      # The Job does not call the Kubernetes API.
      automountServiceAccountToken: false
      {{- include "ow.podSpecCommon" (list $ $jobPod) | nindent 6 }}
      initContainers:
        - name: migrate
          image: {{ include "ow.image" (list $ $c.image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list $ $c.image) }}
          args:
            {{- toYaml (concat (list "migrate" "schema") $config) | nindent 12 }}
          {{- include "ow.containerSecurityContext" (list $ $jobPod) | nindent 10 }}
          {{- with $c.jobs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/consent-migrate
              readOnly: true
            - name: secrets
              mountPath: {{ include "ow.consent.secretDir" $ }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: command
          image: {{ include "ow.image" (list $ $c.image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list $ $c.image) }}
          args:
            {{- toYaml $job.args | nindent 12 }}
          {{- include "ow.containerSecurityContext" (list $ $jobPod) | nindent 10 }}
          {{- with $c.jobs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/consent-migrate
              readOnly: true
            - name: secrets
              mountPath: {{ include "ow.consent.secretDir" $ }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $job.admin }}
            # The password of the new read-only user (--password-file) and
            # of the admin user (--admin-password-file): files of their own
            # Secrets, never arguments or variables.
            - name: read-access
              mountPath: /run/secrets/read-access
              readOnly: true
            - name: read-access-admin
              mountPath: /run/secrets/read-access-admin
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "ow.name" (list $ "consent") }}
            items:
              - key: migrate.yaml
                path: config.yaml
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              {{- range $path, $file := include "ow.db.secretFiles" (list $ "consent" "database-password") | fromJson }}
              - secret:
                  name: {{ $file.secret }}
                  items:
                    - key: {{ $file.key }}
                      path: {{ $path }}
              {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- with $job.admin }}
        - name: read-access
          secret:
            secretName: {{ $job.readerPassword.secret }}
            defaultMode: 0440
            items:
              - key: {{ $job.readerPassword.key }}
                path: password
        - name: read-access-admin
          secret:
            secretName: {{ .secret }}
            defaultMode: 0440
            items:
              - key: {{ .key }}
                path: password
        {{- end }}
{{- end }}
{{- end }}
